<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
  <style>
    .lbl { fill: #111; }
    .dim { fill: #555; }
    .axis { stroke: #111; stroke-width: 1.5; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .bar { fill: #111; }
    .barLight { fill: #aaa; }
    .title { font-size: 16px; font-weight: 600; }
  </style>
  <rect width="800" height="380" fill="#fff"/>
  <text class="title" x="400" y="32" text-anchor="middle">attacker cost: credential stuffing vs inspectable-trust</text>
  <text class="dim" x="400" y="52" text-anchor="middle" font-size="12">USD per attempt at scale (1M identities)</text>

  <!-- Y axis -->
  <line class="axis" x1="120" y1="80" x2="120" y2="320"/>
  <line class="axis" x1="120" y1="320" x2="760" y2="320"/>

  <!-- Y gridlines: log scale, $1k / $5k / $20k -->
  <g class="grid">
    <line x1="120" y1="280" x2="760" y2="280"/>
    <line x1="120" y1="220" x2="760" y2="220"/>
    <line x1="120" y1="160" x2="760" y2="160"/>
    <line x1="120" y1="100" x2="760" y2="100"/>
  </g>
  <text class="dim" x="115" y="324" text-anchor="end">$1k</text>
  <text class="dim" x="115" y="284" text-anchor="end">$2k</text>
  <text class="dim" x="115" y="224" text-anchor="end">$5k</text>
  <text class="dim" x="115" y="164" text-anchor="end">$10k</text>
  <text class="dim" x="115" y="104" text-anchor="end">$20k</text>

  <!-- Bars: cred-stuff $1k, openai $1.4k, haiku-cached $5k, haiku-no-cache $16k -->
  <!-- Position: 200, 360, 520, 680 -->
  <!-- Heights: keep consistent log-ish: $1k at 320, $20k at 100 -->

  <rect class="barLight" x="170" y="318" width="60" height="2"/>
  <text class="dim" x="200" y="340" text-anchor="middle" font-size="11">$1k</text>
  <text class="dim" x="200" y="358" text-anchor="middle">credential</text>
  <text class="dim" x="200" y="372" text-anchor="middle">stuffing</text>

  <rect class="bar" x="330" y="312" width="60" height="8"/>
  <text class="dim" x="360" y="340" text-anchor="middle" font-size="11">$1.4k</text>
  <text class="dim" x="360" y="358" text-anchor="middle">trust w/</text>
  <text class="dim" x="360" y="372" text-anchor="middle">gpt-4.1-nano</text>

  <rect class="bar" x="490" y="220" width="60" height="100"/>
  <text class="dim" x="520" y="340" text-anchor="middle" font-size="11">$5k</text>
  <text class="dim" x="520" y="358" text-anchor="middle">trust w/ haiku</text>
  <text class="dim" x="520" y="372" text-anchor="middle">(cached)</text>

  <rect class="bar" x="650" y="120" width="60" height="200"/>
  <text class="dim" x="680" y="340" text-anchor="middle" font-size="11">$16k</text>
  <text class="dim" x="680" y="358" text-anchor="middle">trust w/ haiku</text>
  <text class="dim" x="680" y="372" text-anchor="middle">(no cache)</text>

  <text class="dim" x="400" y="78" text-anchor="middle" font-size="12">…and that's just the cost of trying. observed success rate vs probes: 0%</text>
</svg>

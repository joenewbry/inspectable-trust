<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
  <style>
    .box { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .lbl { fill: #111; }
    .dim { fill: #555; }
    .arrow { stroke: #111; stroke-width: 1.5; fill: none; }
    .title { font-size: 16px; font-weight: 600; }
    .ph { font-size: 14px; font-weight: 600; }
  </style>
  <rect width="900" height="320" fill="#fff"/>
  <text class="title" x="450" y="34" text-anchor="middle">a session, in five phases</text>

  <!-- Five phase boxes -->
  <g>
    <rect class="box" x="30" y="80" width="150" height="120"/>
    <text class="ph" x="105" y="108" text-anchor="middle">1 · OPEN</text>
    <text class="dim" x="105" y="135" text-anchor="middle">declare</text>
    <text class="dim" x="105" y="153" text-anchor="middle">intent</text>
    <text class="dim" x="105" y="178" text-anchor="middle" font-size="11">"I'm Joe's tax-prep</text>
    <text class="dim" x="105" y="194" text-anchor="middle" font-size="11">agent. I need …"</text>
  </g>

  <g>
    <rect class="box" x="200" y="80" width="150" height="120"/>
    <text class="ph" x="275" y="108" text-anchor="middle">2 · HANDSHAKE</text>
    <text class="dim" x="275" y="135" text-anchor="middle">probe + answer</text>
    <text class="dim" x="275" y="153" text-anchor="middle">1–4 rounds</text>
    <text class="dim" x="275" y="178" text-anchor="middle" font-size="11">smoothed confidence</text>
    <text class="dim" x="275" y="194" text-anchor="middle" font-size="11">vs threshold</text>
  </g>

  <g>
    <rect class="box" x="370" y="80" width="150" height="120"/>
    <text class="ph" x="445" y="108" text-anchor="middle">3 · GRANT</text>
    <text class="dim" x="445" y="135" text-anchor="middle">responder writes</text>
    <text class="dim" x="445" y="153" text-anchor="middle">contract.md (prose)</text>
    <text class="dim" x="445" y="178" text-anchor="middle" font-size="11">scope · hard-nos ·</text>
    <text class="dim" x="445" y="194" text-anchor="middle" font-size="11">counter-offers</text>
  </g>

  <g>
    <rect class="box" x="540" y="80" width="150" height="120"/>
    <text class="ph" x="615" y="108" text-anchor="middle">4 · WORK</text>
    <text class="dim" x="615" y="135" text-anchor="middle">commands judged</text>
    <text class="dim" x="615" y="153" text-anchor="middle">one by one</text>
    <text class="dim" x="615" y="178" text-anchor="middle" font-size="11">allow / deny /</text>
    <text class="dim" x="615" y="194" text-anchor="middle" font-size="11">counter-offer · drift</text>
  </g>

  <g>
    <rect class="box" x="710" y="80" width="150" height="120"/>
    <text class="ph" x="785" y="108" text-anchor="middle">5 · CLOSE</text>
    <text class="dim" x="785" y="135" text-anchor="middle">commit hash to</text>
    <text class="dim" x="785" y="153" text-anchor="middle">both history.logs</text>
    <text class="dim" x="785" y="178" text-anchor="middle" font-size="11">daily ratchet</text>
    <text class="dim" x="785" y="194" text-anchor="middle" font-size="11">advances</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M180 140 L200 140"/>
  <polygon points="200,140 192,136 192,144" fill="#111"/>
  <path class="arrow" d="M350 140 L370 140"/>
  <polygon points="370,140 362,136 362,144" fill="#111"/>
  <path class="arrow" d="M520 140 L540 140"/>
  <polygon points="540,140 532,136 532,144" fill="#111"/>
  <path class="arrow" d="M690 140 L710 140"/>
  <polygon points="710,140 702,136 702,144" fill="#111"/>

  <!-- Bottom annotations -->
  <text class="dim" x="450" y="248" text-anchor="middle" font-size="13">drift outside scope walks a 4-step ladder:</text>
  <text class="dim" x="450" y="270" text-anchor="middle" font-size="13">in-scope → soft-challenge → warn-and-log → terminate</text>
  <text class="dim" x="450" y="296" text-anchor="middle" font-size="12">most agent confusion is recoverable; sustained drift is not</text>
</svg>
